<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
<rect width="400" height="300" fill="#fff"/>
<!-- Floating astronaut. NOTE4C image library, CC0. -->
<rect x="0" y="0" width="400" height="300" fill="#000"/>
<!-- stars -->
<g fill="#fff"><path d="M50 50 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3 l9 -3z"/><path d="M350 240 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3 l9 -3z"/><rect x="100" y="250" width="4" height="4"/><rect x="330" y="40" width="4" height="4"/><rect x="20" y="160" width="4" height="4"/><rect x="380" y="120" width="4" height="4"/><rect x="140" y="20" width="3" height="3"/><rect x="260" y="280" width="3" height="3"/><rect x="60" y="280" width="3" height="3"/><rect x="300" y="12" width="3" height="3"/></g>
<!-- planet with ring (red) -->
<circle cx="336" cy="96" r="34" fill="#ff0000" stroke="#fff" stroke-width="4"/>
<path d="M306 90 C320 84 352 84 366 92" stroke="#000" stroke-width="3" fill="none"/>
<ellipse cx="336" cy="100" rx="58" ry="12" fill="none" stroke="#fff" stroke-width="5" transform="rotate(-18 336 100)"/>
<!-- tether -->
<path d="M120 196 C70 230 60 280 20 300" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="10 5"/>
<g transform="rotate(-14 200 150)">
<!-- backpack -->
<rect x="136" y="96" width="128" height="120" rx="16" fill="#fff" stroke="#000" stroke-width="0"/>
<rect x="140" y="100" width="120" height="112" rx="14" fill="rgb(120,120,120)" stroke="#000" stroke-width="5"/>
<!-- legs -->
<path d="M170 210 C164 240 150 254 140 266" fill="none" stroke="#000" stroke-width="40" stroke-linecap="round"/>
<path d="M170 210 C164 240 150 254 140 266" fill="none" stroke="#fff" stroke-width="30" stroke-linecap="round"/>
<path d="M230 210 C240 236 256 246 270 252" fill="none" stroke="#000" stroke-width="40" stroke-linecap="round"/>
<path d="M230 210 C240 236 256 246 270 252" fill="none" stroke="#fff" stroke-width="30" stroke-linecap="round"/>
<rect x="118" y="256" width="40" height="22" rx="8" fill="#000" transform="rotate(30 138 266)"/>
<rect x="256" y="240" width="40" height="22" rx="8" fill="#000" transform="rotate(-20 276 250)"/>
<!-- arms -->
<path d="M156 150 C120 150 104 130 100 106" fill="none" stroke="#000" stroke-width="38" stroke-linecap="round"/>
<path d="M156 150 C120 150 104 130 100 106" fill="none" stroke="#fff" stroke-width="28" stroke-linecap="round"/>
<path d="M244 150 C276 160 296 176 304 200" fill="none" stroke="#000" stroke-width="38" stroke-linecap="round"/>
<path d="M244 150 C276 160 296 176 304 200" fill="none" stroke="#fff" stroke-width="28" stroke-linecap="round"/>
<circle cx="100" cy="98" r="16" fill="#ff0000" stroke="#000" stroke-width="5"/>
<circle cx="306" cy="206" r="16" fill="#ff0000" stroke="#000" stroke-width="5"/>
<!-- torso -->
<rect x="152" y="120" width="96" height="100" rx="26" fill="#fff" stroke="#000" stroke-width="7"/>
<path d="M226 126 C242 134 246 150 246 168 V196 C246 210 238 218 226 218Z" fill="rgb(150,150,150)"/>
<rect x="172" y="154" width="46" height="30" rx="4" fill="#fff" stroke="#000" stroke-width="4"/>
<g fill="#000"><rect x="178" y="160" width="10" height="6"/></g><rect x="194" y="160" width="10" height="6" fill="#ff0000"/>
<path d="M178 174 h32" stroke="#000" stroke-width="3"/>
<path d="M152 196 h96" stroke="#000" stroke-width="4"/>
<!-- helmet -->
<circle cx="200" cy="90" r="56" fill="#fff" stroke="#000" stroke-width="8"/>
<rect x="152" y="58" width="96" height="64" rx="30" fill="#000"/>
<path d="M166 76 C174 66 188 62 200 62" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
<path d="M226 104 C232 98 236 92 236 84" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
<!-- reflection of planet in visor -->
<circle cx="218" cy="98" r="8" fill="#ff0000"/>
<path d="M146 100 a56 56 0 0 0 108 0" fill="none" stroke="#000" stroke-width="3"/>
<rect x="190" y="26" width="20" height="10" rx="3" fill="#ff0000" stroke="#000" stroke-width="3"/>
</g>
</svg>
