<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
<rect width="400" height="300" fill="#fff"/>
<!-- Balloons and confetti (birthday). NOTE4C image library, CC0. -->
<g fill="#000"><rect x="30" y="30" width="10" height="5" transform="rotate(30 35 32)"/><rect x="330" y="40" width="12" height="5" transform="rotate(-20 336 42)"/><rect x="360" y="160" width="10" height="5" transform="rotate(50 365 162)"/><rect x="40" y="200" width="12" height="5" transform="rotate(-40 46 202)"/><rect x="300" y="250" width="10" height="5" transform="rotate(20 305 252)"/><rect x="90" y="270" width="10" height="5" transform="rotate(60 95 272)"/></g>
<g fill="#ff0000"><rect x="70" y="80" width="12" height="6" transform="rotate(-30 76 83)"/><rect x="350" y="100" width="12" height="6" transform="rotate(40 356 103)"/><rect x="20" y="130" width="12" height="6" transform="rotate(10 26 133)"/><rect x="370" y="220" width="12" height="6" transform="rotate(-50 376 223)"/><rect x="130" y="20" width="12" height="6" transform="rotate(70 136 23)"/><rect x="60" y="250" width="12" height="6"/></g>
<g fill="none" stroke="#000" stroke-width="3" stroke-linecap="round"><path d="M300 20 q10 10 0 20 q-10 10 0 20"/><path d="M30 80 q10 6 20 0 q10 -6 20 0"/><path d="M340 290 q10 -6 20 0 q10 6 20 0"/></g>
<g fill="#fff" stroke="#000" stroke-width="2"><circle cx="100" cy="50" r="5"/><circle cx="380" cy="70" r="4"/><circle cx="20" cy="280" r="4"/><circle cx="340" cy="200" r="5"/></g>
<!-- strings -->
<g fill="none" stroke="#000" stroke-width="3"><path d="M150 186 C140 220 170 240 196 270"/><path d="M262 180 C270 220 230 240 204 270"/><path d="M206 150 C200 200 206 240 200 270"/></g>
<!-- bow -->
<path d="M200 270 l-20 -10 v20z M200 270 l20 -10 v20z" fill="#ff0000" stroke="#000" stroke-width="3" stroke-linejoin="round"/><circle cx="200" cy="270" r="5" fill="#000"/>
<!-- back balloon (striped white) -->
<ellipse cx="206" cy="80" rx="50" ry="60" fill="rgb(0,0,150)" stroke="#000" stroke-width="6"/>
<path d="M200 140 l6 -8 l6 8z" fill="#000"/>
<!-- left balloon (hatched) -->
<ellipse cx="148" cy="124" rx="52" ry="62" fill="rgb(110,110,110)" stroke="#000" stroke-width="6"/>
<path d="M118 92 C122 76 134 68 146 66" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
<path d="M142 186 l6 -8 l6 8z" fill="#000"/>
<!-- red balloon (hero) -->
<ellipse cx="264" cy="116" rx="56" ry="66" fill="#ff0000" stroke="#000" stroke-width="7"/>
<path d="M300 72 C320 100 320 150 290 172 C306 140 306 100 300 72Z" fill="rgb(128,0,0)"/>
<path d="M232 80 C236 66 248 58 260 56" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
<circle cx="230" cy="98" r="4" fill="#fff"/>
<path d="M256 182 l8 -8 l8 8z" fill="#000"/>
<!-- banner flags -->
<path d="M0 8 C100 40 300 40 400 8" fill="none" stroke="#000" stroke-width="3"/>
<g stroke="#000" stroke-width="3" stroke-linejoin="round"><path d="M40 20 l8 24 l12 -20z" fill="#ff0000"/><path d="M110 32 l6 24 l14 -20z" fill="#fff"/><path d="M180 36 l6 24 l14 -22z" fill="#ff0000"/><path d="M250 34 l6 24 l14 -20z" fill="#fff"/><path d="M320 26 l6 24 l14 -18z" fill="#ff0000"/></g>
</svg>
