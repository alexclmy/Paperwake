<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
<rect width="400" height="300" fill="#fff"/>
<!-- Curled-up cat. NOTE4C image library, CC0. -->
<!-- rug (red, with fringe) -->
<ellipse cx="200" cy="236" rx="176" ry="48" fill="#ff0000" stroke="#000" stroke-width="6"/>
<ellipse cx="200" cy="236" rx="150" ry="36" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="10 6"/>
<g stroke="#000" stroke-width="3"><path d="M28 236 h-14 M372 236 h14 M40 260 l-12 6 M360 260 l12 6 M40 212 l-12 -6 M360 212 l12 -6"/></g>
<!-- cat body -->
<path d="M96 210 C80 150 130 100 200 100 C276 100 320 150 312 200 C306 240 260 252 200 250 C140 252 104 244 96 210Z" fill="#fff" stroke="#000" stroke-width="7" stroke-linejoin="round"/>
<!-- tabby stripes on back (engraving) -->
<clipPath id="cb"><path d="M96 210 C80 150 130 100 200 100 C276 100 320 150 312 200 C306 240 260 252 200 250 C140 252 104 244 96 210Z"/></clipPath>
<g clip-path="url(#cb)">
<path d="M150 104 C200 90 290 110 312 170 C300 150 260 128 200 126 C170 124 150 130 130 140Z" fill="rgb(70,70,70)"/>
<g fill="none" stroke="#000" stroke-width="6" stroke-linecap="round"><path d="M176 104 C170 120 176 134 186 140"/><path d="M214 102 C210 120 218 134 230 140"/><path d="M250 110 C248 128 256 140 268 146"/><path d="M284 128 C282 142 290 154 300 158"/></g>
<path d="M240 210 C270 200 296 200 312 190 C306 234 270 248 220 250Z" fill="rgb(150,150,150)"/>
</g>
<!-- tail wrapping round front -->
<path d="M300 210 C320 240 260 262 190 258 C150 256 120 248 112 236 C150 244 210 248 262 236 C286 230 296 220 300 210Z" fill="#fff" stroke="#000" stroke-width="6" stroke-linejoin="round"/>
<g stroke="#000" stroke-width="5"><path d="M246 238 l6 16 M210 244 l2 14 M174 244 l-2 12"/></g>
<!-- head tucked at left -->
<path d="M84 220 C70 180 92 146 132 146 C170 146 186 178 178 210 C170 240 100 252 84 220Z" fill="#fff" stroke="#000" stroke-width="7" stroke-linejoin="round"/>
<!-- ears -->
<path d="M94 164 L86 122 L120 148Z" fill="#fff" stroke="#000" stroke-width="6" stroke-linejoin="round"/>
<path d="M140 146 L162 112 L170 156Z" fill="#fff" stroke="#000" stroke-width="6" stroke-linejoin="round"/>
<path d="M94 154 L90 132 L108 148Z M150 146 L160 126 L164 150Z" fill="#ff0000"/>
<!-- forehead stripes -->
<g stroke="#000" stroke-width="4" stroke-linecap="round"><path d="M122 154 v14 M132 152 v12 M112 156 v12"/></g>
<!-- closed eyes -->
<g fill="none" stroke="#000" stroke-width="5" stroke-linecap="round"><path d="M100 190 C106 198 116 198 120 190"/><path d="M140 190 C146 198 156 198 160 190"/></g>
<!-- nose + mouth -->
<path d="M126 204 h10 l-5 6z" fill="#ff0000" stroke="#000" stroke-width="3" stroke-linejoin="round"/>
<path d="M131 210 c-2 6 -8 8 -12 4 M131 210 c2 6 8 8 12 4" fill="none" stroke="#000" stroke-width="3"/>
<!-- whiskers -->
<g stroke="#000" stroke-width="2.5" stroke-linecap="round"><path d="M100 208 l-34 -4 M100 214 l-32 6 M162 208 l34 -6 M162 214 l30 6"/></g>
<!-- paws -->
<path d="M150 236 c0 -12 30 -12 30 0 c0 8 -30 8 -30 0z" fill="#fff" stroke="#000" stroke-width="5"/>
<path d="M160 232 v8 M170 232 v8" stroke="#000" stroke-width="2"/>
<!-- Zz -->
<g fill="none" stroke="#000" stroke-width="5" stroke-linejoin="miter"><path d="M196 60 h18 l-18 20 h18"/><path d="M226 30 h12 l-12 14 h12" stroke-width="4"/></g>
</svg>
